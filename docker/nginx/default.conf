server {
    listen 80;
    server_name localhost;
    root /app/public;
    index index.php;

    client_max_body_size 32M;

    error_log  /var/log/nginx/bnt_error.log warn;
    access_log /var/log/nginx/bnt_access.log;

    # Static assets caching (images, stylesheets, fonts)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|webp|ttf|woff|woff2|txt)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Main routing through public/index.php Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
